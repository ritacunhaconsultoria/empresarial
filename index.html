<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proposta Empresarial — Rita Cunha · Consultoria de Imagem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root{
      --vinho:#8c1f1f;
      --vinho-dk:#6a1616;
      --vinho-lt:#b84040;
      --creme:#faf6f2;
      --bege:#f0e8e0;
      --cinza:#5c5c5c;
      --escuro:#1f1f1f;
      --branco:#ffffff;
      --sombra:rgba(0,0,0,0.12);
      --font-serif:'Cormorant Garamond',Georgia,serif;
      --font-sans:'Montserrat',Arial,sans-serif;
      --trans:.3s ease;
    }

    html{scroll-behavior:smooth}
    body{font-family:var(--font-sans);color:var(--escuro);background:var(--creme);line-height:1.65}
    .container{width:90%;max-width:1100px;margin:auto}

    /* ===== TOPBAR ===== */
    .topbar{
      background:var(--vinho);padding:16px 0;color:var(--branco);
      position:sticky;top:0;z-index:1000;
      transition:padding var(--trans),box-shadow var(--trans);
    }
    .topbar.scrolled{padding:10px 0;box-shadow:0 4px 24px rgba(0,0,0,.22)}
    .nav{display:flex;justify-content:space-between;align-items:center}
    .logo-text{font-family:var(--font-serif);font-size:26px;font-weight:300;letter-spacing:3px;color:var(--branco);text-transform:uppercase;text-decoration:none}
    .nav-right{display:flex;align-items:center;gap:32px}
    .menu{display:flex;gap:28px}
    .menu a{color:rgba(255,255,255,.88);text-decoration:none;font-weight:600;font-size:12px;letter-spacing:1.5px}
    .menuBtn{display:none;background:none;border:none;cursor:pointer}
    .menuBtn span{display:block;width:24px;height:2px;background:var(--branco);margin:6px 0}

    /* ===== HERO ===== */
    .hero-proposta{background:var(--escuro);padding:90px 0 80px;position:relative;overflow:hidden}
    .hero-proposta::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--vinho-dk) 0%,transparent 65%);opacity:.55}
    .hero-proposta-inner{position:relative;z-index:2}
    .hero-proposta h1{font-family:var(--font-serif);font-size:clamp(38px,6vw,72px);font-weight:300;line-height:1.08;color:var(--branco)}
    .hero-proposta h1 em{font-style:italic;color:rgba(255,180,180,.85)}

    /* ===== MAGAZINE SECTION ===== */
    .magazine-section{padding:70px 0 90px;background:var(--creme)}
    .mag-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px}
    .mag-header-left h2{font-family:var(--font-serif);font-size:clamp(28px,4vw,42px);font-weight:300;color:var(--escuro)}
    .mag-counter{font-family:var(--font-serif);font-size:56px;font-weight:300;color:rgba(140,31,31,0.12)}

    /* ===== BOOK STAGE ===== */
    .book-stage{position:relative;width:100%;max-width:580px;margin:0 auto}
    .book-frame{
      width:100%;background:#111;border-radius:4px;overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,.28);position:relative;
      aspect-ratio:1/1.4142; perspective: 2000px;
    }

    .page{position:absolute;inset:0;opacity:0;z-index:1;transition: opacity 0.4s;}
    .page.active{opacity:1;z-index:2}
    .page img{width:100%;height:100%;object-fit:cover;display:block}

    /* Flip panel — Lógica Horizontal Corrigida */
    .flip-panel{
      position:absolute;top:0;bottom:0;width:50%;
      transform-style:preserve-3d;
      transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);
      z-index:100;opacity:0;pointer-events:none;
    }
    .flip-panel.right-panel{right:0;transform-origin:left center}
    .flip-panel.left-panel{left:0;transform-origin:right center}
    .flip-panel.animating{opacity:1}
    .flip-panel.flip-in{transform:rotateY(-180deg)}
    .flip-panel.left-panel.flip-in{transform:rotateY(180deg)}

    .flip-face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#111}
    .flip-face.flip-back{transform:rotateY(180deg)}
    .flip-face img{position:absolute;top:0;width:200%;height:100%;object-fit:cover}

    /* Posicionamento preciso das metades */
    .from-right img, .to-left img { left: -100%; }
    .from-left img, .to-right img { left: 0; }

    .flip-shadow{position:absolute;inset:0;background:rgba(0,0,0,0.1);opacity:0;transition:opacity 0.4s}
    .flip-panel.animating .flip-shadow{opacity:1}

    /* Overlays */
    .slide-badge{position:absolute;bottom:16px;left:16px;background:rgba(0,0,0,0.5);color:#fff;padding:5px 12px;border-radius:50px;font-size:9px;z-index:10}
    .slide-num{position:absolute;bottom:16px;right:18px;font-size:10px;color:rgba(255,255,255,0.4);z-index:10}

    /* Click zones */
    .click-prev, .click-next{position:absolute;top:0;bottom:0;width:30%;z-index:60;cursor:pointer}
    .click-prev{left:0}.click-next{right:0}

    .arrow-hint{
      position:absolute;top:50%;transform:translateY(-50%);z-index:70;
      width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,0.3);
      color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transition:0.3s;
    }
    .arrow-hint.left{left:14px}.arrow-hint.right{right:14px}
    .book-stage:hover .arrow-hint{opacity:1}
    .hidden{display:none}

    /* ===== CONTROLS ===== */
    .mag-controls{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:20px}
    .ctrl-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(140,31,31,0.3);background:#fff;color:var(--vinho);cursor:pointer}
    .ctrl-btn:disabled{opacity:0.3}
    .progress-wrap{width:100%;max-width:960px;margin:16px auto 0;height:2px;background:var(--bege)}
    .progress-fill{height:100%;background:var(--vinho);width:0;transition:width 0.4s}

    .thumbs-section{background:var(--escuro);padding:40px 0}
    .thumbs-strip{display:flex;gap:8px;overflow-x:auto;padding:0 5%}
    .thumb{flex-shrink:0;width:88px;height:55px;opacity:0.5;cursor:pointer;border:2px solid transparent}
    .thumb.active{opacity:1;border-color:var(--vinho)}
    .thumb img{width:100%;height:100%;object-fit:cover}

    @media(max-width:768px){
      .mag-counter{display:none}
      .menuBtn{display:block}
    }
  </style>
</head>
<body>

<header class="topbar" id="topo">
  <div class="container nav">
    <a class="logo-text" href="#">Rita Cunha</a>
    <button id="menuBtn" class="menuBtn"><span></span><span></span><span></span></button>
    <nav id="menu" class="menu"><a href="#">CONTATO</a></nav>
  </div>
</header>

<section class="hero-proposta">
  <div class="container hero-proposta-inner">
    <p style="color:var(--vinho-lt); font-size:11px; letter-spacing:4px; margin-bottom:18px;">CONSULTORIA DE IMAGEM</p>
    <h1>Proposta<br><em>Empresarial</em></h1>
  </div>
</section>

<section class="magazine-section">
  <div class="container">
    <div class="mag-header">
      <div class="mag-header-left"><h2>Proposta Empresarial</h2></div>
      <div class="mag-counter"><strong id="magCur">01</strong><span>/ 18</span></div>
    </div>

    <div class="book-stage">
      <div class="book-frame" id="bookFrame">
        <div id="pagesContainer"></div>

        <div class="flip-panel" id="flipPanel">
          <div class="flip-face flip-front"><img id="flipFrontImg" src=""></div>
          <div class="flip-face flip-back"><img id="flipBackImg" src=""></div>
          <div class="flip-shadow"></div>
        </div>

        <span class="slide-badge" id="stageBadge">01 · Capa</span>
        <span class="slide-num" id="stageNum">01 / 18</span>

        <div class="click-prev" id="clickPrev"></div>
        <div class="click-next" id="clickNext"></div>
      </div>
      <div class="arrow-hint left" id="arrowLeft">←</div>
      <div class="arrow-hint right" id="arrowRight">→</div>
    </div>

    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

    <div class="mag-controls">
      <button class="ctrl-btn" id="prevBtn" disabled>←</button>
      <button class="ctrl-btn" id="nextBtn">→</button>
    </div>
  </div>
</section>

<section class="thumbs-section">
  <div class="thumbs-strip" id="thumbsStrip"></div>
</section>

<script>
const slides = [
  {src:'/empresarial/assets/slide-1.jpg', badge:'01 · Capa'},
  {src:'/empresarial/assets/slide-2.jpg', badge:'02 · Catálogo'},
  {src:'/empresarial/assets/slide-3.jpg', badge:'03 · Catálogo'},
  {src:'/empresarial/assets/slide-4.jpg', badge:'04 · Catálogo'},
  {src:'/empresarial/assets/slide-5.jpg', badge:'05 · Consultoria'},
  {src:'/empresarial/assets/slide-6.jpg', badge:'06 · Serviço'},
  {src:'/empresarial/assets/slide-7.jpg', badge:'07 · Diagnóstico'},
  {src:'/empresarial/assets/slide-8.jpg', badge:'08 · Guarda Roupa'},
  {src:'/empresarial/assets/slide-9.jpg', badge:'09 · Mala'},
  {src:'/empresarial/assets/slide-10.jpg', badge:'10 · Compras'},
  {src:'/empresarial/assets/slide-11.jpg', badge:'11 · Looks'},
  {src:'/empresarial/assets/slide-12.jpg', badge:'12 · Coloração'},
  {src:'/empresarial/assets/slide-13.jpg', badge:'13 · Cuidados'},
  {src:'/empresarial/assets/slide-14.jpg', badge:'14 · Apoio'},
  {src:'/empresarial/assets/slide-15.jpg', badge:'15 · Benefícios'},
  {src:'/empresarial/assets/slide-16.jpg', badge:'16 · Benefícios'},
  {src:'/empresarial/assets/slide-17.jpg', badge:'17 · Investimento'},
  {src:'/empresarial/assets/slide-18.jpg', badge:'18 · Pagamento'}
];

let current = 0;
let animating = false;

// Renderização dinâmica
const pagesContainer = document.getElementById('pagesContainer');
const thumbsStrip = document.getElementById('thumbsStrip');

slides.forEach((s, i) => {
  const p = document.createElement('div');
  p.className = `page ${i===0?'active':''}`;
  p.id = `page-${i}`;
  p.innerHTML = `<img src="${s.src}" alt="Slide ${i+1}">`;
  pagesContainer.appendChild(p);

  const t = document.createElement('div');
  t.className = `thumb ${i===0?'active':''}`;
  t.innerHTML = `<img src="${s.src}">`;
  t.onclick = () => goTo(i);
  thumbsStrip.appendChild(t);
});

function updateUI() {
  const n = current + 1;
  document.getElementById('magCur').textContent = String(n).padStart(2, '0');
  document.getElementById('stageBadge').textContent = slides[current].badge;
  document.getElementById('stageNum').textContent = `${String(n).padStart(2, '0')} / 18`;
  document.getElementById('progressFill').style.width = `${(current / (slides.length - 1)) * 100}%`;
  
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length - 1;
  document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === current));
  document.getElementById('arrowLeft').classList.toggle('hidden', current === 0);
  document.getElementById('arrowRight').classList.toggle('hidden', current === slides.length - 1);
}

function goTo(idx) {
  if (animating || idx === current || idx < 0 || idx >= slides.length) return;
  animating = true;

  const next = idx > current;
  const flipPanel = document.getElementById('flipPanel');
  const flipFrontImg = document.getElementById('flipFrontImg');
  const flipBackImg = document.getElementById('flipBackImg');

  flipPanel.className = `flip-panel ${next ? 'right-panel' : 'left-panel'}`;
  
  flipFrontImg.src = slides[current].src;
  document.querySelector('.flip-front').className = `flip-face flip-front ${next ? 'from-right' : 'from-left'}`;

  flipBackImg.src = slides[idx].src;
  document.querySelector('.flip-back').className = `flip-face flip-back ${next ? 'to-right' : 'to-left'}`;

  flipPanel.classList.add('animating');
  
  requestAnimationFrame(() => {
    setTimeout(() => flipPanel.classList.add('flip-in'), 20);
  });

  setTimeout(() => {
    current = idx;
    document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i === current));
    flipPanel.className = 'flip-panel';
    animating = false;
    updateUI();
  }, 850);
}

document.getElementById('nextBtn').onclick = () => goTo(current + 1);
document.getElementById('prevBtn').onclick = () => goTo(current - 1);
document.getElementById('clickNext').onclick = () => goTo(current + 1);
document.getElementById('clickPrev').onclick = () => goTo(current - 1);

updateUI();
</script>
</body>
</html>
